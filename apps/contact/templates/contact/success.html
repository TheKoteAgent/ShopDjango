{% extends 'base.html' %}
{% load static %}

{% block title %}Message Sent{% endblock %}

{% block main %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div class="card shadow-lg border-0 rounded-4 text-center p-5">
                <div class="mb-4">
                    <i class="bi bi-check-circle-fill text-success display-1 bounce-icon"></i>
                </div>

                <h1 class="display-5 fw-bold text-dark mb-3">Thank You!</h1>
                
                <p class="lead text-muted mb-5">
                    Your message has been sent successfully.<br>
                    We will contact you shortly.
                </p>

                <div class="d-grid gap-3 d-sm-flex justify-content-center">
                    <a href="{% url 'main:lot_list' %}" class="btn btn-primary btn-lg px-4 shadow-sm">
                        <i class="bi bi-house-door me-2"></i>
                        Back to Home
                    </a>

                    <a href="{% url 'contact:contact' %}" class="btn btn-outline-secondary btn-lg px-4">
                        <i class="bi bi-envelope me-2"></i>
                        Send Another
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

<style>
    .bounce-icon {
        display: inline-block;
        animation: bounce 2s infinite;
    }

    @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {
            transform: translateY(0);
        }
        40% {
            transform: translateY(-20px);
        }
        60% {
            transform: translateY(-10px);
        }
    }
</style>
{% endblock %}
