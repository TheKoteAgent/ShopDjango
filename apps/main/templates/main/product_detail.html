{% extends "base.html" %}
{% load static %}

{% block title %}
    {{ lot.title }} - Details
{% endblock %}

{% block main %}
    <div class="mb-4">
        <a href="{% url 'main:lot_list' %}" class="text-decoration-none text-secondary">
            <i class="bi bi-arrow-left"></i> Back to Catalog
        </a>
    </div>

    <div class="row">
        <div class="col-md-6 mb-4">
            {% if lot.img %}
                <img src="{{ lot.img.url }}" class="img-fluid rounded shadow w-100" alt="{{ lot.title }}" style="object-fit: cover;">
            {% else %}
                <img src="https://via.placeholder.com/600x400?text=No+Image" class="img-fluid rounded shadow w-100" alt="No Image">
            {% endif %}
        </div>

        <div class="col-md-6">
            <h1 class="display-5 fw-bolder">{{ lot.title }}</h1>
            
            <div class="fs-2 mb-3 text-primary fw-bold">
                ${{ lot.price }}
            </div>

            <p class="lead">
                {{ lot.desc }}
            </p>

            <div class="d-flex mt-5">
                <input class="form-control text-center me-3" id="inputQuantity" type="number" value="1" min="1" style="max-width: 4rem">
                
                <button class="btn btn-dark flex-shrink-0" type="button">
                    <i class="bi bi-cart-fill me-1"></i>
                    Add to cart
                </button>
            </div>

        </div>
    </div>
{% endblock %}
